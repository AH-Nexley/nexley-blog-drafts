<style>

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}

.mark{font:900 26px/1 Archivo,Impact,sans-serif;letter-spacing:.02em}
p{color:var(--muted);margin:0}
label{font-weight:600;font-size:14px}

button{font:600 16px Inter,sans-serif;padding:12px;border:0;border-radius:6px;background:var(--amber);color:#0B1623;cursor:pointer}
.err{color:#FF9A66;min-height:1.5em;font-size:14px}
</style></head><body>

async function open_(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(B.s),iterations:B.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(B.i)},k,b(B.c));
  var html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('nxpw',pw);}catch(e){}
  document.open();document.write(html);document.close();
}
