<style>
:root{--bg:#0B1623;--ink:#F6F3EC;--muted:#C7CDD6;--amber:#FF6B1A;--field:#122033;--line:#243246}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
form{width:100%;max-width:380px;display:grid;gap:14px}
.mark{font:900 26px/1 Archivo,Impact,sans-serif;letter-spacing:.02em}
p{color:var(--muted);margin:0}
label{font-weight:600;font-size:14px}
input{width:100%;font:16px Inter,sans-serif;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button{font:600 16px Inter,sans-serif;padding:12px;border:0;border-radius:6px;background:var(--amber);color:#0B1623;cursor:pointer}
.err{color:#FF9A66;min-height:1.5em;font-size:14px}
</style></head><body>
